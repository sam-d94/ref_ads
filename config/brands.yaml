# ============================================================
# 브랜드 레퍼런스 수집 설정 — 미디어커머스 업계 (건기식 + 뷰티)
# ------------------------------------------------------------
# !! 핸들(handle)/도메인은 예시값입니다. 실행 전 실제 값을 확인해
#    수정하세요. 존재하지 않는 핸들은 해당 브랜드에서 자동 스킵됩니다.
# ============================================================

settings:
  out_root: references          # 결과 저장 루트
  country: KR                   # Meta Ad Library 국가 필터
  region: KR                    # Google Ads Transparency 지역
  limits:
    youtube: 30                 # 채널당 최근 영상 수
    tiktok: 30
  scrolls:
    meta_adlibrary: 8           # 검색 결과 추가 로딩 스크롤 횟수
    google_ads: 6
    instagram: 4
  concurrency:
    playwright: 2               # 브라우저 동시 실행 수 (올릴수록 차단 위험↑)
    ytdlp: 3
  instagram:
    enabled: false              # true로 켜기 전 README의 세션 저장 절차 필수!
    state_file: config/ig_state.json
  facebook:
    enabled: false              # 실험적 기능 (계정 리스크 높음)
    state_file: config/fb_state.json


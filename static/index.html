<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RefLens - Brand Ad Intelligence</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--card:#fff;--line:#e6e8f0;--text:#14161f;--sub:#69708a;--accent:#5b5ef4;--accent2:#06b6d4;--grad:linear-gradient(135deg,#5b5ef4,#8b5cf6 55%,#06b6d4);--shadow:0 1px 2px rgba(20,22,31,.05),0 8px 24px rgba(20,22,31,.07);--radius:14px}
[data-theme=dark]{--bg:#0c0e14;--panel:#12141d;--card:#161927;--line:#242838;--text:#eceef5;--sub:#8b92ab;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Pretendard","Inter","Segoe UI","Malgun Gothic",sans-serif;font-size:14px;display:flex;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

/* ===== Sidebar ===== */
aside{width:260px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.logo{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.logo b{font-size:15px;letter-spacing:.2px}
.logo small{display:block;color:var(--sub);font-size:10.5px;margin-top:1px}

/* Tabs */
nav.tabs{display:flex;gap:5px;padding:3px 12px 10px;border-bottom:1px solid var(--line)}
nav.tabs a{flex:1;text-align:center;padding:7px 0;border-radius:9px;color:var(--sub);font-weight:600;font-size:12.5px;cursor:pointer;transition:.15s}
nav.tabs a:hover{background:var(--bg)}
nav.tabs a.on{color:#fff;background:var(--grad)}

/* Sidebar sections */
.ssec{padding:10px 14px 4px}
.ssec h4{font-size:10.5px;color:var(--sub);letter-spacing:1px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.ssec h4 .cnt{font-size:10px;opacity:.6;font-weight:400}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font-size:11.5px;color:var(--sub);transition:.15s;user-select:none;background:transparent}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.on{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}

/* Brand search */
.bsearch{width:100%;margin-bottom:6px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:12px;outline:none}
.bsearch:focus{border-color:var(--accent)}

/* Company sections */
.cgroup{border:1px solid var(--line);border-radius:10px;margin-bottom:5px;overflow:hidden;background:var(--panel);transition:border-color .2s}
.cgroup:hover{border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.chead{display:flex;align-items:center;gap:7px;padding:7px 10px;cursor:pointer;user-select:none;font-size:12.5px;font-weight:600}
.chead .arr{font-size:9px;transition:transform .2s;width:12px;text-align:center;color:var(--sub)}
.chead .arr.open{transform:rotate(90deg)}
.chead .cc{width:6px;height:6px;border-radius:50%;flex:none}
.chead .cmeta{margin-left:auto;font-size:10px;color:var(--sub);font-weight:400}
.clist{padding:2px 0 4px;display:none}
.cgroup.open .clist{display:block}
.cgroup.open .chead .arr{transform:rotate(90deg)}
.crow{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 22px;font-size:12px;color:var(--text);cursor:pointer;transition:.12s}
.crow:hover{background:var(--bg)}
.crow.on{color:var(--accent);font-weight:600}
.crow .dot{width:6px;height:6px;border-radius:50%;flex:none}
.crow .cnt{margin-left:auto;font-size:10px;color:var(--sub);background:var(--bg);padding:0 6px;border-radius:99px;border:1px solid var(--line)}

/* Brand list (flat) */
.blist{overflow-y:auto;max-height:22vh;padding-right:3px}
.blist::-webkit-scrollbar{width:4px}.blist::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.brow{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:8px;cursor:pointer;font-size:12px;color:var(--text);transition:.12s}
.brow:hover{background:var(--bg)}
.brow.on{color:var(--accent);font-weight:600}
.brow .dot{width:6px;height:6px;border-radius:50%;flex:none}
.brow .cnt{margin-left:auto;color:var(--sub);font-size:10px;background:var(--bg);padding:0 6px;border-radius:99px;border:1px solid var(--line)}

/* Side footer */
.sidefoot{margin-top:auto;padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px}
.btn{border:0;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px;justify-content:center}
.btn.primary{background:var(--grad);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
.btn.ghost:hover{color:var(--text);border-color:var(--accent)}

/* ===== Main ===== */
main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
header.top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:15}
.gsearch{flex:1;max-width:480px;position:relative}
.gsearch input{width:100%;padding:9px 12px 9px 34px;border-radius:11px;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;transition:.15s}
.gsearch input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.gsearch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--sub)}
.kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
select.sel{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:12px;outline:none;cursor:pointer}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);cursor:pointer;user-select:none}
.toggle .sw{width:32px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.toggle .sw::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw::after{left:16px}
.newpill{display:none;align-items:center;gap:5px;font-size:11.5px;color:#fff;background:var(--grad);padding:5px 10px;border-radius:99px;cursor:pointer;animation:pulse 1.6s infinite}
.newpill.show{display:flex}
@keyframes pulse{50%{opacity:.75}}

/* Scrollable content */
#view{flex:1;overflow-y:auto;padding:20px 24px 90px;scroll-behavior:smooth}
#view::-webkit-scrollbar{width:7px}#view::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

/* ===== Dashboard ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;inset:0 auto auto 0;width:100%;height:3px;background:var(--grad)}
.kpi small{color:var(--sub);font-size:11.5px}
.kpi b{display:block;font-size:26px;margin-top:5px;letter-spacing:-.5px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
@media(max-width:1100px){.duo{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.panel h3{font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.panel h3 .tag{font-size:10px;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);padding:2px 7px;border-radius:99px}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px;font-size:11.5px;color:var(--sub)}
.legend i{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:4px}
.hbar{display:flex;align-items:center;gap:9px;margin-bottom:8px;font-size:12px}
.hbar .name{width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{flex:1;height:8px;background:var(--bg);border-radius:5px;overflow:hidden}
.hbar .fill{height:100%;border-radius:5px;background:var(--grad)}
.hbar .v{width:40px;text-align:right;color:var(--sub);font-size:11px}
h2.vh{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h2.vh small{color:var(--sub);font-size:11.5px;font-weight:400}

/* ===== Gallery ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;position:relative;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 6%,var(--bg)),var(--bg));display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{color:var(--line);font-size:28px}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:4px;z-index:2;flex-wrap:wrap}
.badge{font-size:10px;padding:3px 7px;border-radius:6px;font-weight:700;backdrop-filter:blur(5px)}
.p-meta{background:#1877f2e6;color:#fff}.p-google{background:#34a853e6;color:#fff}
.p-youtube{background:#ff0000e6;color:#fff}.p-tiktok{background:#111;color:#25f4ee;border:1px solid #25f4ee55}
.p-insta{background:linear-gradient(45deg,#f58529,#dd2a7b);color:#fff}
.p-fb{background:#1877f2e6;color:#fff}
.catbadge{background:#000000a6!important;color:#fff!important}
.cbody{padding:10px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.t{font-size:12.5px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b{font-size:11.5px;color:var(--sub);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--sub);padding-top:7px;border-top:1px dashed var(--line)}
.meta .m1{color:var(--accent);font-weight:600}
.skel{border-radius:var(--radius);height:260px;background:linear-gradient(100deg,var(--card) 40%,var(--bg) 50%,var(--card) 60%);background-size:200% 100%;animation:shine 1.2s infinite linear;border:1px solid var(--line)}
@keyframes shine{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--sub);padding:70px 20px}
.empty b{font-size:15px;display:block;margin-bottom:7px;color:var(--text)}
.sentinel{height:10px}

/* ===== Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(10,12,20,.55);backdrop-filter:blur(4px);display:none;z-index:60;padding:4vh 16px}
.overlay.show{display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:820px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:up .18s ease}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.mhero{height:300px;background:#10131a center/contain no-repeat;position:relative}
.mhero img{width:100%;height:100%;object-fit:contain}
.mclose{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:#00000088;color:#fff;border:0;font-size:16px;cursor:pointer}
.mbody{padding:20px 24px 24px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
table.spec{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.spec td{padding:7px 9px;border-bottom:1px solid var(--line)}
table.spec td:first-child{color:var(--sub);width:120px}
.copybtn{font-size:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border:0;border-radius:6px;padding:2px 8px;cursor:pointer;margin-left:6px}

/* ===== Toast ===== */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:11px;font-size:12.5px;font-weight:600;opacity:0;transition:.25s;z-index:80;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ===== Back to top ===== */
#btt{position:fixed;bottom:24px;right:24px;width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;border:0;font-size:16px;cursor:pointer;display:none;z-index:50;box-shadow:0 4px 16px rgba(91,94,244,.35);transition:transform .2s}
#btt:hover{transform:translateY(-2px)}
#btt.show{display:block}
</style>
</head>
<body>

<aside>
  <div class="logo">
    <div class="mark">R</div>
    <div><b>RefLens</b><small>Brand Ad Intelligence</small></div>
  </div>
  <nav class="tabs">
    <a id="tab-dash" class="on">대시보드</a>
    <a id="tab-explore">레퍼런스 탐색</a>
  </nav>
  <div class="ssec" id="secCat"><h4>카테고리 <span class="cnt" id="catCnt"></span></h4><div class="chips" id="catChips"></div></div>
  <div class="ssec" id="secPlat"><h4>플랫폼 <span class="cnt" id="platCnt"></span></h4><div class="chips" id="platChips"></div></div>
  <div class="ssec" id="secCo"><h4>법인/모회사 <span class="cnt" id="coCnt"></span></h4><div id="companyList"></div></div>
  <div class="ssec" id="secBrand"><h4>브랜드 <span class="cnt" id="brandCnt"></span></h4><input class="bsearch" id="brandSearch" placeholder="브랜드 검색..."><div class="blist" id="brandList"></div></div>
  <div class="sidefoot">
    <button class="btn ghost" style="flex:1" onclick="resetAll()">초기화</button>
    <button class="btn primary" style="flex:1.4" onclick="exportCsv()">CSV 다운</button>
  </div>
</aside>

<main>
  <header class="top">
    <div class="gsearch"><span class="ic">&#x2315;</span><input id="q" placeholder="카피 / 해시태그 / 광고주 / 브랜드 검색"><span class="kbd">/</span></div>
    <label class="toggle" id="mediaToggle"><span class="sw"></span>미디어만</label>
    <select class="sel" id="sortSel"><option value="discovered">최근 발견순</option><option value="published">게시일순</option><option value="views">조회수순</option><option value="likes">좋아요순</option><option value="brand">브랜드명순</option></select>
    <div class="newpill" id="newPill" onclick="location.reload()">&#9679; 새 데이터</div>
    <button class="btn ghost" id="themeBtn" onclick="toggleTheme()">&#127769;</button>
  </header>
  <div id="view">
    <section id="dashboard"></section>
    <section id="explore" style="display:none"><h2 class="vh" id="exploreTitle">레퍼런스 탐색</h2><div class="grid" id="grid"></div><div class="sentinel" id="sentinel"></div></section>
  </div>
</main>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<button id="btt" onclick="$('#view').scrollTo({top:0,behavior:'smooth'})">&#8593;</button>

<script>
/* ===== State ===== */
const S={view:'dash',q:'',cats:new Set(),plats:new Set(),brands:new Set(),cos:new Set(),
          sort:'discovered',media:false,page:0,pages:1,total:0,loading:false,ver:0};
const PL={meta_adlibrary:'Meta 광고',google_ads:'Google 광고',youtube:'YouTube',
           tiktok:'TikTok',instagram:'Instagram',facebook:'Facebook'};
const PC={'meta_adlibrary':'#1877f2','google_ads':'#34a853','youtube':'#ff0000',
          'tiktok':'#25f4ee','instagram':'#dd2a7b','facebook':'#3b5998'};
const CC=['#5b5ef4','#06b6d4','#8b5cf6','#10b981','#f59e0b','#ef4444','#ec4899','#14b8a6','#f97316','#6366f1'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n>=10000?(n/10000).toFixed(1)+'만':Number(n||0).toLocaleString();
async function api(p,params){const u=new URL('/api/'+p,location.href);for(const[k,v]of Object.entries(params||{}))if(v!==''&&v!=null)u.searchParams.set(k,v);const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2200)}

/* ===== Single-source view switching (fixes multi-activation bug) ===== */
function setView(v){
  S.view=v;
  $('#tab-dash').classList.toggle('on',v==='dash');
  $('#tab-explore').classList.toggle('on',v==='explore');
  $('#dashboard').style.display=v==='dash'?'':'none';
  $('#explore').style.display=v==='explore'?'':'none';
  if(v==='explore'&&S.page===0)loadItems(true);
  location.hash=v;
}
$('#tab-dash').onclick=()=>setView('dash');
$('#tab-explore').onclick=()=>setView('explore');

/* ===== Sidebar: Category / Platform / Company / Brand ===== */
let _bmap={};
async function initFilters(){
  const[st,bm,co]=await Promise.all([api('stats'),api('brands'),api('companies')]);
  /* category chips */
  const cats=[...new Set(bm.brands.map(b=>b.category_label))].filter(c=>c!=='기타');
  $('#catChips').innerHTML=cats.map(c=>`<span class="chip" data-cat="${esc(c)}" onclick="togCat('${esc(c)}',this)">${esc(c)}</span>`).join('');
  $('#catCnt').textContent=cats.length;
  /* platform chips */
  const platKeys=Object.keys(PL);
  $('#platChips').innerHTML=platKeys.map(k=>`<span class="chip" data-p="${k}" onclick="togPlat('${k}',this)">${PL[k]}</span>`).join('');
  $('#platCnt').textContent=platKeys.length;
  /* company groups */
  _bmap={};bm.brands.forEach(b=>{_bmap[b.name]=b});
  renderCompanies(co.companies||[]);
  /* flat brand list */
  window._brands=bm.brands;
  $('#brandCnt').textContent=bm.brands.length;
  renderBrandList('');
}
function renderCompanies(cos){
  if(!cos.length){$('#secCo').style.display='none';return;}
  $('#secCo').style.display='';
  const colors={};let ci=0;
  $('#companyList').innerHTML=cos.map(c=>{
    if(!colors[c.en])colors[c.en]=CC[ci++%CC.length];
    const brs=c.brands.map(b=>{
      const info=_bmap[b]||{};
      const cnt=info.count||0;
      return `<div class="crow ${S.brands.has(b)?'on':''}" onclick="togBrand('${esc(b)}')"><span class="dot" style="background:${colors[c.en]}"></span>${esc(b)}<span class="cnt">${fmt(cnt)}</span></div>`;
    }).join('');
    const cl=colors[c.en];
    return `<div class="cgroup${S.cos.has(c.name)?' open':''}" id="cgrp-${esc(c.en)}">
      <div class="chead" onclick="toggleCo('${esc(c.name)}',this.parentElement)"><span class="arr${S.cos.has(c.name)?' open':''}">&#9654;</span><span class="cc" style="background:${cl}"></span>${esc(c.label)}<span class="cmeta">${c.brand_count}개 브랜드 &middot; ${fmt(c.item_count)}</span></div>
      <div class="clist">${brs}</div></div>`;
  }).join('');
  $('#coCnt').textContent=cos.length;
}
function renderBrandList(qs){
  const list=(window._brands||[]).filter(b=>!qs||b.name.toLowerCase().includes(qs.toLowerCase())||(_bmap[b.name]||{}).company?.toLowerCase().includes(qs.toLowerCase()));
  $('#brandList').innerHTML=list.map((b,i)=>`<div class="brow ${S.brands.has(b.name)?'on':''}" onclick="togBrand('${esc(b.name)}')"><span class="dot" style="background:${CC[i%CC.length]}"></span>${esc(b.name)}<span class="cnt">${fmt(b.count)}</span></div>`).join('')||'<div style="color:var(--sub);font-size:11px;padding:6px">검색 결과 없음</div>';
}
function togCat(v,el){S.cats.has(v)?S.cats.delete(v):S.cats.add(v);el.classList.toggle('on');apply()}
function togPlat(v,el){S.plats.has(v)?S.plats.delete(v):S.plats.add(v);el.classList.toggle('on');apply()}
function toggleCo(name,el){
  S.cos.has(name)?S.cos.delete(name):S.cos.add(name);
  el.classList.toggle('open');
  el.querySelector('.arr').classList.toggle('open');
}
function togBrand(name){
  S.brands.has(name)?S.brands.delete(name):S.brands.add(name);
  apply(true);
}
$('#brandSearch').addEventListener('input',e=>renderBrandList(e.target.value));

/* ===== Dashboard ===== */
async function renderDash(){
  const s=await api('stats');
  const kpi=(l,v,d='')=>`<div class="kpi"><small>${l}</small><b>${v}</b>${d?`<span style="font-size:11px;color:var(--accent2);font-weight:700;margin-left:5px">${d}</span>`:''}</div>`;
  const maxT=Math.max(...s.timeline.map(t=>t[1]),1);
  const bars=s.timeline.map(([d,c])=>{const h=Math.max(3,c/maxT*110);return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1"><b style="font-size:10px;color:var(--sub)">${c}</b><div style="width:70%;height:${h}px;border-radius:5px;background:var(--grad)" title="${d}: ${c}건"></div><span style="font-size:9px;color:var(--sub)">${d.slice(5)}</span></div>`}).join('');
  const tot=s.by_platform.reduce((a,p)=>a+p.count,0)||1;let off=25;
  const donut=s.by_platform.map(p=>{const f=p.count/tot,l=f*100;const seg=`<circle r="40" cx="60" cy="60" fill="transparent" stroke="${PC[p.key]||'#888'}" stroke-width="16" stroke-dasharray="${l} ${100-l}" stroke-dashoffset="${off}" pathLength="100"></circle>`;off-=l;return seg}).join('');
  const legend=s.by_platform.map(p=>`<span><i style="background:${PC[p.key]||'#888'}"></i>${p.label} ${p.count.toLocaleString()}</span>`).join('');
  const topMax=Math.max(...s.top_brands.map(b=>b.count),1);
  const tops=s.top_brands.map(b=>`<div class="hbar"><span class="name" title="${esc(b.name)}">${esc(b.name)}</span><div class="track"><div class="fill" style="width:${b.count/topMax*100}%"></div></div><span class="v">${b.count.toLocaleString()}</span></div>`).join('');
  const recent=s.recent.map(cardHTML).join('');
  $('#dashboard').innerHTML=`
    <h2 class="vh">수집 현황 <small>state.db 기준 실시간</small></h2>
    <div class="kpis">${kpi('누적 레퍼런스',s.total.toLocaleString()+'건')}${kpi('오늘 신규','+'+s.today+'건')}${kpi('추적 브랜드',s.brand_count+'곳')}${kpi('미디어 보유율',s.media_ratio+'%')}</div>
    <div class="duo">
      <div class="panel"><h3>수집 추이 <span class="tag">14일</span></h3><div style="display:flex;align-items:flex-end;gap:5px;height:160px">${bars||'<span style="color:var(--sub)">데이터 없음</span>'}</div></div>
      <div class="panel"><h3>플랫폼 분포</h3><div style="display:flex;gap:20px;align-items:center"><svg width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg)"><circle r="40" cx="60" cy="60" fill="transparent" stroke="var(--line)" stroke-width="16"></circle><text x="60" y="64" text-anchor="middle" transform="rotate(90 60 60)" style="font-size:16px;font-weight:800" fill="var(--text)">${tot.toLocaleString()}</text>${donut}</svg><div class="legend" style="flex-direction:column;align-items:flex-start">${legend}</div></div></div>
    </div>
    <div class="duo">
      <div class="panel"><h3>브랜드 랭킹 <span class="tag">TOP 10</span></h3>${tops}</div>
      <div class="panel"><h3>최근 발견</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${recent}</div></div>
    </div>`;
}

/* ===== Cards & Explore ===== */
function cardHTML(it){
  const img=it.img?`<img src="${esc(it.img)}" loading="lazy" onerror="this.style.display='none';this.parentElement.querySelector('.ph')?.remove()">`:'';
  const ph=it.img?'':`<span class="ph">&#9638;</span>`;
  return `<div class="card" onclick="openItem(${it.id})"><div class="thumb"><div class="badges"><span class="badge p-${it.platform.replace('_adlibrary','')}">${it.platform_label}</span><span class="badge catbadge">${esc(it.brand)}</span></div>${img}${ph}</div><div class="cbody">${it.title?`<div class="t">${esc(it.title)}</div>`:''}${it.body?`<div class="b">${esc(it.body)}</div>`:''}<div class="meta"><span class="m1">${it.views?`&#128065; ${fmt(it.views)}`:it.likes?`&#9829; ${fmt(it.likes)}`:it.published_at||'--'}</span><span>${esc(it.discovered)}</span></div></div></div>`;
}
async function loadItems(reset){
  if(S.loading)return;S.loading=true;
  if(reset){S.page=0;$('#grid').innerHTML='';for(let i=0;i<8;i++)$('#grid').insertAdjacentHTML('beforeend','<div class="skel"></div>')}
  const next=S.page+1;
  try{
    const d=await api('items',{q:S.q,category:[...S.cats].join(','),brand:[...S.brands].join(','),platform:[...S.plats].join(','),company:[...S.cos].join(','),sort:S.sort,has_media:S.media?'1':'',page:next,per_page:48});
    if(reset)$('#grid').innerHTML='';
    S.page=d.page;S.pages=d.pages;S.total=d.total;
    $('#exploreTitle').innerHTML=`레퍼런스 탐색 <small>${d.total.toLocaleString()}건 &middot; ${(S.page/S.pages*100||0).toFixed(0)}%</small>`;
    d.items.forEach(it=>$('#grid').insertAdjacentHTML('beforeend',cardHTML(it)));
    if(!d.items.length&&reset)$('#grid').innerHTML='<div class="empty" style="grid-column:1/-1"><b>조건에 맞는 레퍼런스가 없습니다</b>사이드바 필터를 조정해 보세요</div>';
  }catch(e){toast('불러오기 실패: '+e.message)}
  S.loading=false;
}
new IntersectionObserver(es=>{if(es[0].isIntersecting&&S.view==='explore'&&S.page<S.pages&&!S.loading)loadItems(false)},{root:$('#view'),rootMargin:'300px'}).observe($('#sentinel'));

/* ===== Modal ===== */
async function openItem(id){
  const it=await api('item/'+id);
  const medias=(it.media_urls||[]).slice(0,8);
  $('#modal').innerHTML=`<div class="mhero" style="background-image:url('${esc(it.img||'')}')"><button class="mclose" onclick="closeModal()">&#10005;</button></div>
    <div class="mbody">
      <div class="mrow"><span class="badge p-${it.platform.replace('_adlibrary','')}">${it.platform_label}</span><span class="badge catbadge">${esc(it.brand)}</span><span class="badge catbadge">${esc(it.category)}</span>${it.company?`<span class="badge catbadge">${esc(it.company)}</span>`:''}${it.page_name?`<span class="badge catbadge">광고주: ${esc(it.page_name)}</span>`:''}<span class="badge catbadge">품질 ${it.quality}</span></div>
      ${it.title?`<h2 style="font-size:16px;margin-bottom:7px">${esc(it.title)}<button class="copybtn" onclick="cp(this)">복사</button></h2>`:''}
      ${it.body?`<p style="color:var(--sub);line-height:1.6;white-space:pre-wrap;font-size:12.5px">${esc(it.body)}<button class="copybtn" onclick="cp(this)">복사</button></p>`:''}
      <table class="spec">
        <tr><td>지표</td><td>${Object.entries(it.metrics||{}).map(([k,v])=>`${k}=<b>${fmt(v)}</b>`).join(' &middot; ')||'--'}</td></tr>
        ${it.platforms_flag?`<tr><td>집행 플랫폼</td><td>${esc(it.platforms_flag)}</td></tr>`:''}
        ${it.handle?`<tr><td>채널</td><td>${esc(it.handle)}</td></tr>`:''}
        ${it.company?`<tr><td>법인</td><td>${esc(it.company)}</td></tr>`:''}
        <tr><td>게시 / 발견</td><td>${esc(it.published_at||'--')} / ${esc(it.discovered)}</td></tr>
        <tr><td>정합성 해시</td><td style="font-family:monospace;font-size:11px">${esc(it.content_hash)}</td></tr>
        <tr><td>원본 링크</td><td><a href="${esc(it.url)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(it.url)}</a></td></tr>
        ${it.landing?`<tr><td>랜딩 페이지</td><td><a href="${esc(it.landing)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(it.landing.slice(0,80))}</a></td></tr>`:''}
      </table>
      ${medias.length>1?`<h3 style="font-size:12px;margin:14px 0 7px">미디어 ${medias.length}개</h3><div style="display:flex;gap:7px;overflow-x:auto">${medias.map(m=>`<img src="/proxy?url=${encodeURIComponent(m)}" style="height:68px;border-radius:9px;border:1px solid var(--line)">`).join('')}</div>`:''}
      <div style="display:flex;gap:7px;margin-top:16px"><a class="btn primary" href="${esc(it.url)}" target="_blank" rel="noopener">원본 열기 &#8599;</a><button class="btn ghost" onclick="closeModal()">닫기</button></div>
    </div>`;
  $('#overlay').classList.add('show');document.body.style.overflow='hidden';
}
function cp(btn){navigator.clipboard.writeText(btn.parentElement.innerText.replace('복사','').trim());btn.textContent='완료';setTimeout(()=>btn.textContent='복사',1200)}
function closeModal(){$('#overlay').classList.remove('show');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus()}});

/* ===== Search / Sort / Media / Apply ===== */
let deb;
$('#q').addEventListener('input',e=>{clearTimeout(deb);deb=setTimeout(()=>{S.q=e.target.value.trim();apply()},250)});
$('#sortSel').addEventListener('change',e=>{S.sort=e.target.value;apply()});
$('#mediaToggle').addEventListener('click',()=>{S.media=!S.media;$('#mediaToggle').classList.toggle('on',S.media);apply()});
function apply(rerenderBrands){if(rerenderBrands)renderBrandList($('#brandSearch').value);setView('explore');loadItems(true)}
function resetAll(){S.q='';$('#q').value='';S.cats.clear();S.plats.clear();S.brands.clear();S.cos.clear();S.media=false;$('#mediaToggle').classList.remove('on');document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));document.querySelectorAll('.crow.on').forEach(c=>c.classList.remove('on'));document.querySelectorAll('.brow.on').forEach(c=>c.classList.remove('on'));document.querySelectorAll('.cgroup.open').forEach(c=>{c.classList.remove('open');c.querySelector('.arr')?.classList.remove('open')});renderBrandList('');setView('explore');loadItems(true)}

/* ===== Export / Theme / BTT ===== */
function qs(){const p=new URLSearchParams();if(S.q)p.set('q',S.q);if(S.cats.size)p.set('category',[...S.cats]);if(S.plats.size)p.set('platform',[...S.plats]);if(S.brands.size)p.set('brand',[...S.brands]);if(S.cos.size)p.set('company',[...S.cos]);if(S.sort!=='discovered')p.set('sort',S.sort);if(S.media)p.set('has_media','1');return p}
function exportCsv(){const p=qs();window.location='/api/export.csv'+(p.toString()?'?'+p:'');toast('CSV 다운로드 시작')}
function toggleTheme(){const cur=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=cur;localStorage.setItem('rl-theme',cur);$('#themeBtn').innerHTML=cur==='dark'?'&#9728;&#65039;':'&#127769;'}
document.documentElement.dataset.theme=localStorage.getItem('rl-theme')||'light';
if(document.documentElement.dataset.theme==='dark')$('#themeBtn').innerHTML='&#9728;&#65039;';

/* Back to top */
$('#view').addEventListener('scroll',()=>{$('#btt').classList.toggle('show',$('#view').scrollTop>400)});

/* New data polling */
async function watchVer(){try{const v=await api('version');if(S.ver&&v.mtime!==S.ver)$('#newPill').classList.add('show');S.ver=v.mtime}catch(e){}setTimeout(watchVer,20000)}

/* Boot */
(async()=>{await initFilters();await renderDash();watchVer();if(location.hash==='#explore')setView('explore')})();
</script>
</body>
</html>
